name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history: the application / business / presentation differential checks read the pre-Part-2 commits.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm --prefix server ci
      - name: Client typecheck
        run: npm run typecheck
      - name: Build client (esbuild) and server
        run: npm run build
      - name: Module graph (order, orphans, cycles, duplicate evaluations)
        run: npm run module:check
      - name: Architecture ratchet
        run: npm run architecture:check
      - name: Temporary pin diagnostics
        run: sha256sum scripts/application-workflow-check.mjs scripts/business-workflow-check.mjs scripts/presentation-platform-check.mjs scripts/architecture-check.mjs scripts/lib/vm-module-bundle.mjs
      # Known baseline failures are allowed ONLY as recorded in docs/refactor/refactor-baseline.json.
      # Any new failure, test-inventory drift or pinned-file drift fails this job. No continue-on-error anywhere.
      - name: Release gate (aggregate)
        run: npm run release:check
  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm --prefix server ci
      - run: pip install -r qa-requirements.txt && python -m playwright install --with-deps chromium
      - name: Release gate including browser acceptance
        run: npm run release:check -- --with-browser
