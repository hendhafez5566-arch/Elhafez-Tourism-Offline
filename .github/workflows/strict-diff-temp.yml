name: TEMP Strict Null Diff

on:
  push:
    branches: [release-gate-fix-staging-temp]
    paths: ['.github/workflows/strict-diff-temp.yml']

jobs:
  diff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Print exact new strict-null diagnostics
        shell: bash
        run: |
          set +e
          git checkout --detach 8c677ebba7ceb09ab64bd5ed133d72b52adf670e
          node node_modules/typescript/bin/tsc -p tsconfig.json --strictNullChecks --pretty false 2>&1 | grep -E '^(src/application/master-actions-workflows.ts|src/ui/clean-pages.ts|src/ui/forms-definitions.ts|src/ui/forms.ts|src/ui/operations-pages.ts)'
          exit 0
